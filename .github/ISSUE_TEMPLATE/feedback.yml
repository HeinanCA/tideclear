---
name: Feedback or feature request
description: Tell us what you need from tideclear for your EKS upgrades.
title: "[feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feedback. Redact account IDs, cluster names and resource names
        if you prefer; the shape of the problem is what matters.
  - type: textarea
    id: upgrade-situation
    attributes:
      label: Your EKS upgrade situation
      description: >-
        Which Kubernetes version are you on, which one are you moving to, and what is
        making the upgrade hard or risky for you?
      placeholder: "Example: 1.31 to 1.32, about 40 workloads, several Helm charts we do not own."
    validations:
      required: true
  - type: textarea
    id: ran-against-cluster
    attributes:
      label: Did you run tideclear against a cluster, and what happened?
      description: >-
        If you did, say what you ran and what it told you. If you did not, say what
        stopped you.
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: The capability you want, and the situation behind it
      description: >-
        What should tideclear do that it does not do today, and what were you doing
        when you needed it?
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `tideclear --version` (if you have it installed)
      render: shell
    validations:
      required: false
  - type: input
    id: heard-about
    attributes:
      label: Where did you hear about this? (optional)
    validations:
      required: false
