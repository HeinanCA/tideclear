version: 2
project_name: tideclear
builds:
  - main: ./cmd/tideclear
    binary: tideclear
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -X github.com/HeinanCA/tideclear/internal/cli.buildVersion={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
